# SQL Server para desarrollo local (opcional). Uso:  docker compose up -d
# Luego en server/.env:  DB_SERVER=localhost  DB_USER=sa  DB_PASSWORD=<la misma clave de abajo>
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alcipizza-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CambiaEstaClave_123"   # mínimo 8 caracteres, con mayúsculas, minúsculas y números
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped
volumes:
  sqldata:
